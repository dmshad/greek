"}],"extra":"","alt":[]},{"id":"a1-052","ko":"τι","tr":"ти","pr":null,"ru":"что; какой","cat":"question","sub":null,"tag":null,"block":"g5","weak":false,"usage":"","notes":[],"rel":[],"roots":[],"forms":null,"ex":[{"ko":"Τι είναι αυτό;","ru":"Что это?"}],"extra":"","alt":[]},{"id":"a1-053","ko":"πού","tr":"пу́","pr":null,"ru":"где; куда","cat":"question","sub":null,"tag":null,"block":"g5","weak":false,"usage":"","notes":[],"rel":[],"roots":[],"forms":null,"ex":[{"ko":"Πού είναι ο Νίκος;","ru":"Где Никос?"}],"extra":"без ударения που — «который»","alt":[]},{"id":"a1-054","ko":"πώς","tr":"по́с","pr":null,"ru":"как","cat":"question","sub":null,"tag":null,"block":"g5","weak":false,"usage":"","notes":[],"rel":[],"roots":[],"forms":null,"ex":[{"ko":"Πώς είσαι;","ru":"Как ты?"}],"extra":"без ударения πως — «что» (союз)","alt":[]},{"id":"a1-055","ko":"η χώρα","tr":"и хо́ра","pr":null,"ru":"страна","cat":"noun","sub":null,"tag":null,"block":9,"weak":false,"usage":"","notes":[],"rel":[],"roots":[],"forms":null,"ex":[{"ko":"Η Ελλάδα είναι χώρα.","ru":"Греция — страна."}],"extra":"","alt":[]},{"id":"a1-056","ko":"η πόλη","tr":"и по́ли","pr":null,"ru":"город","cat":"noun","sub":null,"tag":null,"block":9,"weak":false,"usage":"","notes":[],"rel":[],"roots":[],"forms":null,"ex":[{"ko":"Η Αθήνα είναι πόλη.","ru":"Афины — город."}],"extra":"","alt":[]},{"id":"a1-057","ko":"η γλώσσα","tr":"и гло́са","pr":null,"ru":"язык","cat":"noun","sub":null,"tag":null,"block":9,"weak":false,"usage":"","notes":[],"rel":[],"roots":[],"forms":null,"ex":[{"ko":"Ποια γλώσσα ξέρεις;","ru":"Какой язык ты знаешь?"}],"extra":"также «язык» во рту","alt":[]},{"id":"a1-058","ko":"η Ελλάδα","tr":"и эла́δа","pr":null,"ru":"Греция","cat":"noun","sub":null,"tag":null,"block":9,"weak":false,"usage":"","notes":[],"rel":[],"roots":[],"forms":null,"ex":[{"ko":"Η Ελλάδα είναι χώρα.","ru":"Греция — страна."}],"extra":"страна — всегда с артиклем","alt":[]},{"id":"a1-059","ko":"ο Έλληνας, η Ελληνίδα","tr":"о э́линас, и э ll,"ex":[{"ko":"Ξέρω αγγλικά.","ru":"Я знаю английский."}],"extra":"","alt":[]},{"id":"a1-066","ko":"η Αθήνα","tr":"и аθи́на","pr":null,"ru":"Афины","cat":"noun","sub":null,"tag":null,"block":11,"weak":false,"usage":"","notes":[],"rel":[],"roots":[],"forms":null,"ex":[{"ko":"Μένω στην Αθήνα.","ru":"Я живу в Афинах."}],"extra":"город — с артиклем; в русском мн. ч., в греческом ед.","alt":[]},{"id":"a1-067","ko":"η Κύπρος","tr":"и ки́прос","pr":null,"ru":"Кипр","cat":"noun","sub":null,"tag":null,"block":11,"weak":false,"usage":"","notes":[],"rel":[],"roots":[],"forms":null,"ex":[{"ko":"Η Κύπρος είναι νησί.","ru":"Кипр — остров."}],"extra":"на -ος, но ж. р.: острова и страны — обычно женского рода","alt":[]},{"id":"a1-068","ko":"η θάλασσα","tr":"и θа́ласа","pr":null,"ru":"море","cat":"noun","sub":null,"tag":null,"block":11,"weak":false,"usage":"","notes":[],"rel":[],"roots":[],"forms":null,"ex":[{"ko":"Πού είναι η θάλασσα;","ru":"Где море?"}],"extra":"в русском ср. р., в греческом ж. р.","alt":[]},{"id":"a1-069","ko":"το νησί","tr":"то ниси́","pr":null,"ru":"остров","cat":"noun","sub":null,"tag":null,"block":11,"weak":false,"usage":"","notes":[],"rel":[],"roots":[],"forms":null,"ex":[{"ko":"Η Κρήτη είναι νησί.","ru":"Крит — остров."}],"extra":"мн. τα νησιά","alt":[]},{"id":"a1-070","ko":"ο τουρίστας","tr":"о тури́стас","pr":null,"ru":"турист","cat":"noun","sub":null,"tag":null,"block":12,"weak":false,"usage":"","notes":[],"rel":[],"roots":[],"forms":null,"ex":[{"ko":"Είμαι τουρίστας.","ru":"Я турист."}],"extra":"туристка — η τουρίστρια","alt":[]},{"id":"a1-071","ko":"ξένος","tr":"ксэ́нос","pr":null,"ru":"иностранный; иностранец; чужой","cat":"adj","sub":null,"tag":null,"block":12,"weak":false,"usage":"","notes":[],"rel":[],"roots":[],"forms":null,"ex":[{"ko":"Είμαι ξένη.","ru":"Я иностранка."}],"extra":"ξένος, ξένη, ξένο","alt":[]},{"id":"a1-072","ko":"καταλαβαίνω","tr":"каталавэ́но","pr":null,"ru":"понимать","cat":"verb","sub":null,"tag":null,"block":12,"weak":false,"usage":"","notes":[],"rel":[],"roots":[],"forms":null,"ex":[{"ko":"Δεν καταλαβαίνω.","ru":"Я не понимаю."}],"extra":"δεν καταλαβαίνω","alt":[]},{"id":"a1-073","ko":"ξέρω","tr":"ксэ́ро","pr":null,"ru":"знать, уметь","cat":"verb","sub":null,"tag":null,"block":12,"weak":false,"usage":"","notes":[],"rel":[],"roots":[],"forms":null,"ex":[{"ko":"Δεν ξέρω.","ru":"Не знаю."}],"extra":"","alt":[]},{"id":"a1-074","ko":"λίγο","tr":"ли́го","pr":null,"ru":"немного","cat":"adv","sub":null,"tag":null,"block":12,"weak":false,"usage":"","notes":[],"rel":[],"roots":[],"forms":null,"ex":[{"ko":"Καταλαβαίνω λίγο.","ru":"Я немного понимаю."}],"extra":"","alt":[]}],"grammar":[{"id":"g1","n":1,"title":"Чтение 1: алфавит, звуки, ударение","meaning":"24 буквы, 7 гласных букв на 5 звуков. Большинство букв читается по одной; сочетания букв — в теме 3.\n**Ударение** пишется в каждом слове из двух и более слогов и считается частью написания: без него или на другом слоге — ошибка.\nУпражнения: слово дано ЗАГЛАВНЫМИ (как на вывеске) и с транскрипцией — напиши его строчными с ударением.","task_rk":"запиши строчными с ударением","nokr":true,"schema":[{"title":"Алфавит","cols":["Буква","Звук","Пример"],"rows":[["Α α · άλφα · [а́лфа]","а","Αθήνα [аθи́на]"],["Β β · βήτα · [ви́та]","в (не б!)","βιβλίο [вивли́о]"],["Γ γ · γάμμα · [га́ма]","г; перед э, и — й","γάλα [га́ла]"],["Δ δ · δέλτα · [δэ́лта]","δ (англ. this)","δέκα [δэ́ка]"],["Ε ε · έψιλον · [э́псилон]","э","έξι [э́кси]"],["Ζ ζ · ζήτα · [зи́та]","з","ζάχαρη [за́хари]"],["Η η · ήτα · [и́та]","и","νησί [ниси́]"],["Θ θ · θήτα · [θи́та]","θ (англ. think)","θεός [θэо́с]"],["Ι ι · γιώτα · [йо́та]","и","ψάρι [пса́ри]"],["Κ κ · κάπα · [ка́па]","к","κιλό [кило́]"],["Λ λ · λάμδα · [ла́мδа]","л","λάθος [ла́θос]"],["Μ μ · μι · [ми]","м","μάτι [ма́ти]"],["Ν ν · νι · [ни]","н (не в!)","νερό [нэро́]"],["Ξ ξ · ξι · [кси]","кс","ξένος [ксэ́нос]"],["Ο ο · όμικρον · [о́микрон]","о","όχι [о́хи]"],["Π π · πι · [пи]","п","πάρκο [па́рко]"],["Ρ ρ · ρο · [ро]","р (не п!)","Ρόδος [ро́δос]"],["Σ σ ς · σίγμα · [си́гма]","с; в конце — ς","φίλος [фи́лос]"],["Τ τ · ταυ · [таф]","т","ταξί [такси́]"],["Υ υ · ύψιλον · [и́псилон]","и","ρύζι [ри́зи]"],["Φ φ · φι · [фи]","ф","φως [фос]"],["Χ χ · χι · [хи]","х","χέρι [хэ́ри]"],["Ψ ψ · ψι · [пси]","пс","ψωμί [псоми́]"],["Ω ω · ωμέγα · [омэ́га]","о","ώρα [о́ра]"]],"note":"Обманчивые буквы: β = в, η = и, ν = н, ρ = р, υ = и, χ = х. Звук «и» пишется тремя буквами (η, ι, υ), «о» — двумя (ο, ω): какая буква — запоминается со словом."},{"title":"Где пишется ударение","cols":["Случай","Как пишется"],"rows":[["слово из 2+ слогов","всегда со знаком на ударной гласной · καφές · φίλος · θάλασσα"],["слово из 1 слога","без знака · ο · η · το · τι · φως"],["исключения","ή «или» (η — артикль) · πού «где» · πώς «как»"],["заглавная буква","знак слева сверху · Όλγα · Άννα · Έλενα"],["слово ЗАГЛАВНЫМИ","без ударений · ΤΑΞΙ · ΑΘΗΝΑ"]],"note":"Ударение различает слова: πότε «когда» — ποτέ «никогда». В приложении ответ без ударения или с ударением на другом слоге — ошибка."}],"sections":[{"id":"s1","title":"1. Гласные: 7 букв — 5 звуков","body":"α — а · ε — э · ο и ω — о · η, ι, υ — и. Долготы нет: ο и ω звучат одинаково.\nБезударные гласные не ослабляются: ο всегда «о», никакого «аканья». νερό — нэро́, не «нира́»; θάλασσα — θа́ласа.\nЗвук «э» в греческом не смягчает согласную: μέλι — мэ́ли.","ex":[{"ko":"νερό","ru":"нэро́ — вода"},{"ko":"μέλι","ru":"мэ́ли — мёд"},{"ko":"ρύζι","ru":"ри́зи — рис"}]},{"id":"s2","title":"2. Согласные: что читается не так, как выглядит","body":"**β** = в, **ρ** = р, **ν** = н, **χ** = х, **η** = и — похожи на латинские или русские буквы, но читаются иначе.\n**γ** — мягкое щелевое «г» (как южнорусское); перед звуками «э» и «и» — почти «й»: γάλα — га́ла, γέλιο — йэ́льо.\n**δ** — звонкий межзубный (англ. this), **θ** — глухой межзубный (англ. think). В транскрипции они так и пишутся: δ и θ.\n**ξ** = кс, **ψ** = пс, **ζ** = з.\nДвойные согласные читаются как одна: θάλασσα — θа́ласа, Ελλάδα — эла́δа.\n**σ** перед β, γ, δ, μ, ν, λ, ρ звучит как «з»: κόσμος — ко́змос.","ex":[{"ko":"βιβλίο","ru":"вивли́о — книга"},{"ko":"χέρι","ru":"хэ́ри — рука"},{"ko":"δέκα","ru":"δэ́ка — десять"},{"ko":"θέατρο","ru":"θэ́атро — театр"}]},{"id":"s3","title":"3. Ударение (τόνος)","body":"В каждом слове из двух и более слогов над ударной гласной стоит знак: καφές, φίλος, τηλέφωνο. Ударение бывает только на одном из трёх последних слогов.\nСлова из одного слога пишутся без знака: ο, η, το, τι, φως, γεια, μια.\nИсключения различают пары слов: **ή** «или» — η (артикль); **πού** «где» — που «который»; **πώς** «как» — πως «что».\nНа заглавной букве знак стоит слева сверху: Όλγα, Άννα. Слова, написанные целиком заглавными (вывески, заголовки), пишутся без ударений: ΤΑΞΙ.","ex":[{"ko":"νερό ή γάλα;","ru":"нэро́ и га́ла? — вода или молоко?"},{"ko":"το ταξί","ru":"то такси́ — такси"}]},{"id":"s4","title":"4. Конечная ς","body":"Буква σ в конце слова пишется как **ς**: φίλος, καφές, Νάξος. В начале и в середине — σ: σαλάτα, θάλασσα.\nНа iPhone клавиша сигмы одна: в конце слова клавиатура сама ставит ς. В приложении σ в конце слова ошибкой не считается.","ex":[{"ko":"ο φίλος","ru":"о фи́лос — друг"},{"ko":"ο καφές","ru":"о кафэ́с — кофе"}]},{"id":"s5","title":"5. Клавиатура iPhone","body":"Добавить: Настройки → Основные → Клавиатура → Клавиатуры → Новые клавиатуры → Греческая. Переключение — кнопкой 🌐.\n**Ударение** — клавиша «΄» в верхнем ряду справа. Нажимается **после** гласной: α, затем «΄» → ά.\n**ς** отдельно набирать не нужно: клавиша Σ одна, в конце слова буква меняется сама.\nВопросительный знак в греческом выглядит как «;»: Τι κάνεις; В ответах приложения знаки препинания не проверяются.","ex":[]}],"usage":[{"id":"u1","sit":"Прочитать слово по буквам","phrase":"ταξί","note":"та-кси́: каждая буква — свой звук, знак показывает ударный слог.","ex":[{"ko":"σαλάτα","ru":"сала́та — салат"}]},{"id":"u2","sit":"Вывеска заглавными","phrase":"ΘΑΛΑΣΣΑ → θάλασσα","note":"Заглавными — без ударений; строчными — ударение обязательно.","ex":[]},{"id":"u3","sit":"Поставить ударение","phrase":"καφές","note":"Знак — над ударной гласной; в односложных словах — нет.","ex":[{"ko":"φως","ru":"фос — свет"}]},{"id":"u4","sit":"Конечная ς","phrase":"ο φίλος","note":"σ в конце слова пишется как ς.","ex":[]}],"rel":[],"new":[],"parts":[{"id":"q1","title":"Буквы и звуки","intro":"Как читается каждая буква. Главное — запомнить обманчивые буквы: β = в, η = и, ν = н, ρ = р, χ = х.","schema":[0],"sections":["s1","s2"],"usage":["u1","u2"],"ex":[[{"ru":"Строчными: ΤΑΞΙ — такси́ (такси)","ko":"ταξί","alt":[],"u":"u1","traps":[]},{"ru":"Строчными: ΜΕΤΡΟ — мэтро́ (метро)","ko":"μετρό","alt":[],"u":"u1","traps":[]},{"ru":"Строчными: ΑΘΗΝΑ — аθи́на (Афины)","ko":"Αθήνα","alt":[],"u":"u1","traps":[]},{"ru":"Строчными: ΣΙΝΕΜΑ — синэма́ (кино)","ko":"σινεμά","alt":[],"u":"u1","traps":[]},{"ru":"Строчными: ΚΙΛΟ — кило́ (килограмм)","ko":"κιλό","alt":[],"u":"u1","traps":[]}],[{"ru":"Строчными: ΛΕΜΟΝΙ — лэмо́ни (лимон)","ko":"λεμόνι","alt":[],"u":"u2","traps":[]},{"ru":"Строчными: ΣΑΛΑΤΑ — сала́та (салат)","ko":"σαλάτα","alt":[],"u":"u2","traps":[]},{"ru":"Строчными: ΠΑΤΑΤΑ — пата́та (картофель)","ko":"πατάτα","alt":[],"u":"u2","traps":[]},{"ru":"Строчными: ΡΥΖΙ — ри́зи (рис)","ko":"ρύζι","alt":[],"u":"u2","traps":[]},{"ru":"Строчными: ΤΥΡΙ — тири́ (сыр)","ko":"τυρί","alt":[],"u":"u2","traps":[]}],[{"ru":"Строчными: ΓΑΛΑ — га́ла (молоко)","ko":"γάλα","alt":[],"u":"u1","traps":[]},{"ru":"Строчными: ΨΑΡΙ — пса́ри (рыба)","ko":"ψάρι","alt":[],"u":"u1","traps":[]},{"ru":"Строчными: ΞΕΝΟΣ — ксэ́нос (иностранец)","ko":"ξένος","alt":[],"u":"u2","traps":[]},{"ru":"Строчными: ΖΑΧΑΡΗ — за́хари (сахар)","ko":"ζάχαρη","alt":[],"u":"u2","traps":[]},{"ru":"Строчными: ΘΑΛΑΣΣΑ — θа́ласа (море)","ko":"θάλασσα","alt":[],"u":"u2","traps":[]}]]},{"id":"q2","title":"Ударение, ς и клавиатура","intro":"Ударение пишется в каждом слове из двух и более слогов; ς — в конце слова. На iPhone ударение — клавиша «΄» после гласной.","schema":[1],"sections":["s3","s4","s5"],"usage":["u3","u4"],"ex":[[{"ru":"Строчными: ΚΑΦΕΣ — кафэ́с (кофе)","ko":"καφές","alt":[],"u":"u3","traps":[]},{"ru":"Строчными: Ο ΦΙΛΟΣ — о фи́лос (друг)","ko":"ο φίλος","alt":[],"u":"u4","traps":[]},{"ru":"Строчными: ΤΗΛΕΦΩΝΟ — тилэ́фоно (телефон)","ko":"τηλέφωνο","alt":[],"u":"u3","traps":[]},{"ru":"Строчными: ΘΕΑΤΡΟ — θэ́атро (театр)","ko":"θέατρο","alt":[],"u":"u3","traps":[]},{"ru":"Строчными: ΕΛΛΑΔΑ — эла́δа (Греция)","ko":"Ελλάδα","alt":[],"u":"u3","traps":[]}],[{"ru":"Строчными: ΟΛΓΑ — о́лга (Ольга)","ko":"Όλγα","alt":[],"u":"u3","traps":[]},{"ru":"Строчными: Η ΚΡΗΤΗ — и кри́ти (Крит)","ko":"η Κρήτη","alt":[],"u":"u3","traps":[]},{"ru":"Строчными: ΤΟ ΝΕΡΟ — то нэро́ (вода)","ko":"το νερό","alt":[],"u":"u3","traps":[]},{"ru":"Строчными: ΝΕΡΟ Η ΓΑΛΑ — нэро́ и́ га́ла (вода или молоко)","ko":"νερό ή γάλα","alt":[],"u":"u3","traps":[]},{"ru":"Строчными: ΟΧΙ — о́хи (нет)","ko":"όχι","alt":[],"u":"u3","traps":[]}],[{"ru":"Строчными: ΦΩΣ — фос (свет)","ko":"φως","alt":[],"u":"u3","traps":[]},{"ru":"Строчными: ΨΑΡΙ Η ΚΡΕΑΣ — пса́ри и́ крэ́ас (рыба или мясо)","ko":"ψάρι ή κρέας","alt":[],"u":"u3","traps":[]},{"ru":"Строчными: ΔΩΔΕΚΑ — δо́δэка (двенадцать)","ko":"δώδεκα","alt":[],"u":"u3","traps":[]},{"ru":"Строчными: ΝΑΞΟΣ — на́ксос (Наксос)","ko":"Νάξος","alt":[],"u":"u4","traps":[]},{"ru":"Строчными: ΕΞΙ — э́кси (шесть)","ko":"έξι","alt":[],"u":"u3","traps":[]}]]}]},{"id":"g3","n":3,"title":"Чтение 2: сочетания букв","meaning":"Две буквы — один звук: ου = у, αι = э, ει / οι = и; μπ = б, ντ = д, τσ = ц. Перед гласной γ звучит как «й», а безударное ι почти сливается со следующей гласной.\nУпражнения на словах темы «Приветствия» и новых словах. **Прочитай** — запиши греческое слово русскими буквами, ударение можно не ставить (слова подобраны без δ и θ). **Допиши** — в слове пропущено сочетание букв: напиши слово целиком, с ударением.","task_rk":"задания на чтение","nokr":true,"schema":[{"title":"Сочетания гласных","cols":["Буквы","Звук","Пример"],"rows":[["ου","у","σούπα [су́па] · μουσική [мусики́]"],["αι","э","και [кэ] · χαίρετε [хэ́рэтэ]"],["ει · οι · υι","и","είκοσι [и́коси] · τοίχος [ти́хос]"],["αυ · ευ","ав · эв — перед гласной и звонкой","αυγό [авго́] · Ευρώπη [эвро́пи]"],["αυ · ευ","аф · эф — перед θ κ ξ π σ τ φ χ ψ","αυτός [афто́с] · ευχαριστώ [эфхаристо́]"]],"note":"Ударение на сочетании ставится над второй буквой: είκοσι, σούπα, ευχαριστώ. Односложные слова (και, ναι) — по общему правилу без знака."},{"title":"Сочетания согласных","cols":["Буквы","В начале слова","В середине слова"],"rows":[["μπ","б · μπίρα [би́ра]","мб · λάμπα [ла́мба]"],["ντ","д · ντομάτα [дома́та]","нд · πέντε [пэ́ндэ]"],["γκ","г · γκρι [гри]","нг"],["γγ","—","нг · Αγγλία [англи́а]"],["τσ","ц · τσάι [ца́и]","ц · έτσι [э́ци]"],["τζ","дз · τζάμι [дза́ми]","дз"]],"note":"В живой речи μπ, ντ, γκ в середине слова часто звучат просто как б, д, г. Исключение темы: συγγνώμη — сигно́ми."},{"title":"γ и ι перед гласной","cols":["Сочетание","Звук","Пример"],"rows":[["γ + ε, αι, ι, η, υ, ει, οι","й","γυναίκα [йинэ́ка] · τι γίνεται; [ти йи́нэтэ?]"],["γι, γει + гласная","й + гласная","γεια σου [йа су] · γιαγιά [йайа́]"],["согласная + безударное ι + гласная","ь + гласная: ья, ьо, ью","παιδιά [пэδья́] · πιάτο [пья́то] · ήλιος [и́льос]"]],"note":"Звук «й» после γ и мягкий призвук после других согласных — это один слог: γεια — один слог, παιδιά — два."}],"sections":[{"id":"s1","title":"1. Две гласные — один звук","body":"**ου** = у: σούπα — су́па, πού — пу.\n**αι** = э: και — кэ, χαίρετε — хэ́рэтэ.\n**ει, οι, υι** = и: είκοσι — и́коси, τοίχος — ти́хос.\nУдарение в таком сочетании ставится над второй буквой: είκοσι, σούπα, ευχαριστώ.","ex":[{"ko":"καλημέρα","ru":"калимэ́ра — доброе утро"},{"ko":"χαίρετε","ru":"хэ́рэтэ — здравствуйте"},{"ko":"τι κάνεις;","ru":"ти ка́нис? — как дела?"}]},{"id":"s2","title":"2. αυ и ευ","body":"υ после α и ε звучит как согласная: «в» перед гласной и звонкой согласной, «ф» перед глухой (θ, κ, ξ, π, σ, τ, φ, χ, ψ).\nαυγό — авго́, Ευρώπη — эвро́пи; αυτός — афто́с, ευχαριστώ — эфхаристо́.","ex":[{"ko":"ευχαριστώ","ru":"эфхаристо́ — спасибо"},{"ko":"αύριο","ru":"а́врио — завтра"}]},{"id":"s3","title":"3. Когда буквы читаются раздельно","body":"Если ударение стоит на первой букве пары или над второй стоят две точки (ϊ, ϋ), буквы читаются отдельно: τσάι — ца́и, ρολόι — роло́и, λαϊκή — лаики́.\nТакие слова в курсе редкие — набирать точки почти не придётся.","ex":[{"ko":"τσάι","ru":"ца́и — чай"},{"ko":"λαϊκή","ru":"лаики́ — уличный рынок"}]},{"id":"s4","title":"4. Две согласные — один звук","body":"**μπ** — б в начале слова, мб в середине: μπίρα — би́ра, λάμπα — ла́мба.\n**ντ** — д / нд: ντομάτα — дома́та, πέντε — пэ́ндэ.\n**γκ** — г / нг: γκρι — гри. **γγ** — нг: Αγγλία — англи́а.\n**τσ** — ц: τσάι, έτσι. **τζ** — дз: τζάμι.\nИсключение: συγγνώμη «извините» читается сигно́ми.","ex":[{"ko":"εντάξει","ru":"энда́кси — хорошо, ладно"},{"ko":"έτσι κι έτσι","ru":"э́ци ки э́ци — так себе"},{"ko":"συγγνώμη","ru":"сигно́ми — извините"}]},{"id":"s5","title":"5. γ перед «э» и «и» — «й»","body":"Перед ε, αι, ι, η, υ, ει, οι буква γ звучит как «й»: γυναίκα — йинэ́ка, γίνεται — йи́нэтэ.\nВ γι, γει + гласная буква ι не читается отдельно: γεια — йа (один слог), γιαγιά — йайа́.","ex":[{"ko":"γεια σου","ru":"йа су — привет"},{"ko":"τι γίνεται;","ru":"ти йи́нэтэ? — как жизнь?"}]},{"id":"s6","title":"6. Безударное ι перед гласной","body":"После согласной безударное ι (а также ει, οι, υ) перед гласной не образует слога — получается мягкий призвук: παιδιά — пэδья́, πιάτο — пья́то, ήλιος — и́льос.\nВ некоторых книжных словах ι звучит полностью: δωμάτιο — δома́тио; в словаре такие слова отмечены транскрипцией.\n**σ** перед звонкими (β, γ, δ, μ, ν, λ, ρ) звучит как «з»: κόσμος — ко́змос.","ex":[{"ko":"παιδιά","ru":"пэδья́ — дети"},{"ko":"καρδιά","ru":"карδья́ — сердце"}]}],"usage":[{"id":"u1","sit":"Сочетание гласных","phrase":"καλημέρα · ευχαριστώ","note":"ου, αι, ει, οι — один звук; αυ, ευ — ав/аф, эв/эф.","ex":[]},{"id":"u2","sit":"Сочетание согласных","phrase":"εντάξει · έτσι","note":"μπ, ντ, γκ, τσ, τζ — один звук.","ex":[]},{"id":"u3","sit":"γ и ι перед гласной","phrase":"γεια σου · παιδιά","note":"γ → й; безударное ι — мягкий призвук.","ex":[]}],"rel":[{"id":"g1"}],"new":[],"parts":[{"id":"q1","title":"Сочетания гласных","intro":"ου = у, αι = э, ει / οι = и; αυ, ευ — ав/аф, эв/эф. Ударение — над второй буквой пары.","schema":[0],"sections":["s1","s2","s3"],"usage":["u1"],"ex":[[{"ru":"Прочитай: σούπα (суп)","ko":"супа","alt":["су́па"],"u":"u1","traps":[],"say":"σούπα"},{"ru":"Прочитай: είκοσι (двадцать)","ko":"икоси","alt":["и́коси"],"u":"u1","traps":[],"say":"είκοσι"},{"ru":"Прочитай: χαίρετε (здравствуйте)","ko":"хэрэтэ","alt":["хе́рете","херете","хэ́рэтэ"],"u":"u1","traps":[],"say":"χαίρετε"},{"ru":"Допиши: κ__ζίνα — кузи́на (кухня)","ko":"κουζίνα","alt":[],"u":"u1","traps":[]},{"ru":"Допиши: __χαριστώ — эфхаристо́ (спасибо)","ko":"ευχαριστώ","alt":[],"u":"u1","traps":[]}],[{"ru":"Прочитай: ευχαριστώ πολύ (большое спасибо)","ko":"эфхаристо поли","alt":["ефхаристо поли","ефхаристо́ поли́","эфхаристо́ поли́"],"u":"u1","traps":[],"say":"ευχαριστώ πολύ"},{"ru":"Прочитай: αυτός (он)","ko":"афтос","alt":["афто́с"],"u":"u1","traps":[],"say":"αυτός"},{"ru":"Прочитай: καιρός (погода)","ko":"кэрос","alt":["керо́с","керос","кэро́с"],"u":"u1","traps":[],"say":"καιρός"},{"ru":"Допиши: χ__ρετε — хэ́рэтэ (здравствуйте)","ko":"χαίρετε","alt":[],"u":"u1","traps":[]},{"ru":"Допиши: __γό — авго́ (яйцо)","ko":"αυγό","alt":[],"u":"u1","traps":[]}],[{"ru":"Прочитай: τι κάνεις; (как дела?, на «ты»)","ko":"ти канис","alt":["ти ка́нис"],"u":"u1","traps":[],"say":"τι κάνεις;"},{"ru":"Прочитай: Ευρώπη (Европа)","ko":"эвропи","alt":["евро́пи","европи","эвро́пи"],"u":"u1","traps":[],"say":"Ευρώπη"},{"ru":"Прочитай: τοίχος (стена)","ko":"тихос","alt":["ти́хос"],"u":"u1","traps":[],"say":"τοίχος"},{"ru":"Допиши: μ__σική — мусики́ (музыка)","ko":"μουσική","alt":[],"u":"u1","traps":[]},{"ru":"Допиши: κ__ρός — кэро́с (погода)","ko":"καιρός","alt":[],"u":"u1","traps":[]}],[{"ru":"Прочитай: τσάι (чай)","ko":"цаи","alt":["ца́и"],"u":"u1","traps":[],"say":"τσάι"},{"ru":"Прочитай: λαϊκή (уличный рынок)","ko":"лаики","alt":["лаики́"],"u":"u1","traps":[],"say":"λαϊκή"},{"ru":"Прочитай: τι κάνετε; (как дела?, на «вы»)","ko":"ти канэтэ","alt":["ти ка́нете","ти ка́нэтэ","ти канете"],"u":"u1","traps":[],"say":"τι κάνετε;"},{"ru":"Допиши: __ρώπη — эвро́пи (Европа)","ko":"Ευρώπη","alt":[],"u":"u1","traps":[]},{"ru":"Допиши: π__δί — пэδи́ (ребёнок)","ko":"παιδί","alt":[],"u":"u1","traps":[]}]]},{"id":"q2","title":"Сочетания согласных","intro":"μπ = б (мб), ντ = д (нд), γκ = г (нг), τσ = ц, τζ = дз.","schema":[1],"sections":["s4"],"usage":["u2"],"ex":[[{"ru":"Прочитай: μπίρα (пиво)","ko":"бира","alt":["би́ра"],"u":"u2","traps":[],"say":"μπίρα"},{"ru":"Прочитай: εντάξει (хорошо, ладно)","ko":"эндакси","alt":["енда́кси","ендакси","энда́кси"],"u":"u2","traps":[],"say":"εντάξει"},{"ru":"Прочитай: τσάντα (сумка)","ko":"цанда","alt":["ца́нда"],"u":"u2","traps":[],"say":"τσάντα"},{"ru":"Допиши: λά__α — ла́мба (лампа)","ko":"λάμπα","alt":[],"u":"u2","traps":[]},{"ru":"Допиши: __ομάτα — дома́та (помидор)","ko":"ντομάτα","alt":[],"u":"u2","traps":[]}],[{"ru":"Прочитай: πέντε (пять)","ko":"пэндэ","alt":["пе́нде","пенде","пэ́ндэ"],"u":"u2","traps":[],"say":"πέντε"},{"ru":"Прочитай: έτσι κι έτσι (так себе)","ko":"эци ки эци","alt":["е́ци ки е́ци","еци ки еци","э́ци ки э́ци"],"u":"u2","traps":[],"say":"έτσι κι έτσι"},{"ru":"Прочитай: Αγγλία (Англия)","ko":"англиа","alt":["англи́а"],"u":"u2","traps":[],"say":"Αγγλία"},{"ru":"Допиши: α__ίο — анди́о (до свидания)","ko":"αντίο","alt":[],"u":"u2","traps":[]},{"ru":"Допиши: κορί__ι — кори́ци (девочка)","ko":"κορίτσι","alt":[],"u":"u2","traps":[]}],[{"ru":"Прочитай: κέντρο (центр)","ko":"кэндро","alt":["ке́ндро","кендро","кэ́ндро"],"u":"u2","traps":[],"say":"κέντρο"},{"ru":"Прочитай: γκρι (серый)","ko":"гри","alt":[],"u":"u2","traps":[],"say":"γκρι"},{"ru":"Прочитай: τζάμι (стекло)","ko":"дзами","alt":["дза́ми"],"u":"u2","traps":[],"say":"τζάμι"},{"ru":"Допиши: __ίρα — би́ра (пиво)","ko":"μπίρα","alt":[],"u":"u2","traps":[]},{"ru":"Допиши: __άι — ца́и (чай)","ko":"τσάι","alt":[],"u":"u2","traps":[]}],[{"ru":"Прочитай: λάμπα (лампа)","ko":"ламба","alt":["ла́мба"],"u":"u2","traps":[],"say":"λάμπα"},{"ru":"Прочитай: Πέμπτη (четверг)","ko":"пэмпти","alt":["пе́мпти","пемпти","пэ́мпти"],"u":"u2","traps":[],"say":"Πέμπτη"},{"ru":"Прочитай: συγγνώμη (извините; читается не по правилу)","ko":"сигноми","alt":["сигно́ми"],"u":"u2","traps":[],"say":"συγγνώμη"},{"ru":"Допиши: Α__λία — англи́а (Англия)","ko":"Αγγλία","alt":[],"u":"u2","traps":[]},{"ru":"Допиши: ε__άξει — энда́кси (хорошо, ладно)","ko":"εντάξει","alt":[],"u":"u2","traps":[]}]]},{"id":"q3","title":"γ и ι перед гласной","intro":"γ перед «э» и «и» — «й»; безударное ι перед гласной — мягкий призвук, а не отдельный слог.","schema":[2],"sections":["s5","s6"],"usage":["u3"],"ex":[[{"ru":"Прочитай: γεια σου (привет, на «ты»)","ko":"йа су","alt":["я су"],"u":"u3","traps":[],"say":"γεια σου"},{"ru":"Прочитай: γυναίκα (женщина)","ko":"йинэка","alt":["йине́ка","йинека","йинэ́ка"],"u":"u3","traps":[],"say":"γυναίκα"},{"ru":"Прочитай: πιάτο (тарелка)","ko":"пьято","alt":["пья́то","пя́то","пято"],"u":"u3","traps":[],"say":"πιάτο"},{"ru":"Допиши: __αγιά — йайа́ (бабушка)","ko":"γιαγιά","alt":[],"u":"u3","traps":[]},{"ru":"Допиши: π__διά — пэδья́ (дети)","ko":"παιδιά","alt":[],"u":"u3","traps":[]}],[{"ru":"Прочитай: γεια σας (здравствуйте, на «вы»)","ko":"йа сас","alt":["я сас"],"u":"u3","traps":[],"say":"γεια σας"},{"ru":"Прочитай: γιατρός (врач)","ko":"йатрос","alt":["йатро́с","ятро́с","ятрос"],"u":"u3","traps":[],"say":"γιατρός"},{"ru":"Прочитай: ήλιος (солнце)","ko":"ильос","alt":["и́льос","и́лёс","илёс"],"u":"u3","traps":[],"say":"ήλιος"},{"ru":"Допиши: __ατρός — йатро́с (врач)","ko":"γιατρός","alt":[],"u":"u3","traps":[]},{"ru":"Допиши: γυν__κα — йинэ́ка (женщина)","ko":"γυναίκα","alt":[],"u":"u3","traps":[]}],[{"ru":"Прочитай: τι γίνεται; (как жизнь?)","ko":"ти йинэтэ","alt":["ти йи́нете","ти йи́нэтэ","ти йинете"],"u":"u3","traps":[],"say":"τι γίνεται;"},{"ru":"Прочитай: μακαρόνια (макароны)","ko":"макаронья","alt":["макаро́нья","макаро́ня","макароня"],"u":"u3","traps":[],"say":"μακαρόνια"},{"ru":"Прочитай: κόσμος (мир, люди)","ko":"козмос","alt":["ко́змос"],"u":"u3","traps":[],"say":"κόσμος"},{"ru":"Допиши: __κογένεια — икойэ́нья (семья)","ko":"οικογένεια","alt":[],"u":"u3","traps":[]},{"ru":"Допиши: δουλ__ά — δулья́ (работа)","ko":"δουλειά","alt":[],"u":"u3","traps":[]}],[{"ru":"Прочитай: ποιος; (кто?)","ko":"пьос","alt":["пёс"],"u":"u3","traps":[],"say":"ποιος;"},{"ru":"Прочитай: χιόνι (снег)","ko":"хьони","alt":["хьо́ни","хё́ни","хёни"],"u":"u3","traps":[],"say":"χιόνι"},{"ru":"Прочитай: γιαγιά (бабушка)","ko":"йайа","alt":["йайа́","яя","яя́"],"u":"u3","traps":[],"say":"γιαγιά"},{"ru":"Допиши: καρδ__ — карδья́ (сердце)","ko":"καρδιά","alt":[],"u":"u3","traps":[]},{"ru":"Допиши: κ__ζίνα — кузи́на (кухня)","ko":"κουζίνα","alt":[],"u":"u3","traps":[]}]]}]},{"id":"g5","n":5,"title":"Местоимения, είμαι, отрицание δεν, вопрос","meaning":"Глагол είμαι «быть» (в русском настоящем времени он опускается: «я — Мария» = Είμαι η Μαρία). Личное местоимение обычно не нужно — лицо видно по форме глагола. С именами всегда артикль: ο Νίκος, η Μαρία; «кто такой» — без артикля: Είμαι φίλος.\nОтрицание — δεν перед глаголом. Вопрос — та же фраза с вопросительной интонацией и знаком «;».\nУпражнения: перевод фраз РУС→ГРЕ (проверка строгая) и ГРЕ→РУС (сверяешь сам). Местоимение в скобках в эталоне — можно писать, можно нет.","task_rk":"переведи на греческий","schema":[{"title":"είμαι — быть","cols":["Лицо","Форма","Пример"],"rows":[["εγώ — я","είμαι","Είμαι η Μαρία."],["εσύ — ты","είσαι","Είσαι ο Νίκος;"],["αυτός, αυτή, αυτό — он, она, оно","είναι","Αυτή είναι η Άννα."],["εμείς — мы","είμαστε","Είμαστε η Άννα και η Μαρία."],["εσείς — вы","είστε (разг. είσαστε)","Είστε η κυρία Ελένη;"],["αυτοί, αυτές, αυτά — они","είναι","Αυτοί είναι ο Νίκος και ο Γιάννης."]],"note":"είναι — и «он/она/оно», и «они»: кто именно — по местоимению или по смыслу."},{"title":"Он, она, оно, они","cols":["","Ед. ч.","Мн. ч."],"rows":[["м. р.","αυτός","αυτοί"],["ж. р.","αυτή","αυτές"],["ср. р.","αυτό","αυτά"]],"note":"Род местоимения — по роду существительного: το παιδί → αυτό (даже о мальчике). Для смешанной группы — αυτοί."},{"title":"Отрицание и вопрос","cols":["Что","Как"],"rows":[["не + глагол","δεν είμαι · δεν είσαι"],["нет (ответ)","όχι · Όχι, δεν είμαι η Μαρία."],["вопрос да/нет","интонация + «;» · Είσαι ο Νίκος;"],["что? где? как?","τι; · πού; · πώς;"],["и · но · или","και (κι) · αλλά · ή"]],"note":"Пары с ударением: πού «где» — που «который», πώς «как» — πως «что», ή «или» — η (артикль)."}],"sections":[{"id":"s1","title":"1. είμαι: шесть форм","body":"В русском «быть» в настоящем времени пропускается, в греческом — нет: «Я — Мария» = **Είμαι η Μαρία**, «Он — друг» = **Είναι φίλος**.\nείμαι, είσαι, είναι, είμαστε, είστε, είναι. Форма είναι общая для «он, она, оно» и «они».\nείστε в разговоре часто звучит как είσαστε — оба варианта верны.","ex":[{"ko":"Είμαι η Άννα.","ru":"Я — Анна."},{"ko":"Είσαι φίλος.","ru":"Ты — друг."},{"ko":"Είμαστε η Άννα και η Μαρία.","ru":"Мы — Анна и Мария."}]},{"id":"s2","title":"2. Местоимение — только для выделения","body":"Форма глагола уже показывает лицо, поэтому местоимение обычно опускают: **Είμαι** η Μαρία, а не «Εγώ είμαι η Μαρία».\nМестоимение ставят, когда противопоставляют или подчёркивают: **Εγώ** είμαι η Άννα, **εσύ**; — «Я Анна, а ты?»","ex":[{"ko":"Εγώ είμαι ο Νίκος, εσύ;","ru":"Я — Никос, а ты?"}]},{"id":"s3","title":"3. Артикль после είμαι","body":"**Имена — всегда с артиклем**: ο перед мужским, η перед женским — Είμαι **η** Μαρία, Αυτός είναι **ο** Γιάννης. Без артикля («Είμαι Μαρία») — ошибка. Исключение: после με λένε — без артикля: Με λένε Μαρία.\n**Кто такой, что такое — без артикля**: Είμαι **φίλος** — «я друг», Είναι **παιδί** — «это ребёнок», Είναι **γυναίκα** — «это женщина». Так отвечают на вопрос «кто ты / что это?».\n**С артиклем — «тот самый», уже известный**: Είναι **το** παιδί — «это (тот самый) ребёнок», Είμαι **ο** φίλος της Μαρίας — «я тот друг Марии». В русском разницы не слышно; в упражнениях этой темы «Я — друг», «Это ребёнок» — без артикля.\nПодробно об артиклях — тема 7.","ex":[{"ko":"Αυτός είναι ο Γιάννης.","ru":"Это Янис."},{"ko":"Ο Γιάννης είναι φίλος.","ru":"Янис — друг."},{"ko":"Είναι παιδί.","ru":"Это ребёнок."}]},{"id":"s4","title":"4. αυτός, αυτή, αυτό; вежливое εσείς","body":"3-е лицо различает род: **αυτός** (м. р.), **αυτή** (ж. р.), **αυτό** (ср. р.); мн. ч. — αυτοί, αυτές, αυτά. Род — грамматический: το παιδί, το κορίτσι → αυτό.\nТе же слова значат «этот, эта, это»: **Αυτός είναι ο Νίκος** — «Это Никос».\n**εσείς** + είστε — и «вы» нескольким, и вежливое «Вы» одному: Είστε η κυρία Ελένη;","ex":[{"ko":"Αυτό είναι παιδί.","ru":"Это ребёнок."},{"ko":"Εσείς είστε ο κύριος Νίκος;","ru":"Вы — господин Никос?"}]},{"id":"s5","title":"5. Отрицание: δεν и όχι","body":"**δεν** — «не», стоит прямо перед глаголом: Δεν είμαι η Μαρία. Αυτός δεν είναι φίλος.\n**όχι** — «нет», ответ отдельным словом: Όχι, δεν είμαι η Μαρία. «Όχι είμαι» — ошибка.\nВ речи перед некоторыми согласными бывает δε, но перед гласной (είμαι) — всегда δεν.","ex":[{"ko":"Όχι, δεν είμαι η Ελένη.","ru":"Нет, я не Елена."},{"ko":"Δεν είναι αγόρι, είναι κορίτσι.","ru":"Это не мальчик, это девочка."}]},{"id":"s6","title":"6. Вопрос","body":"Вопрос «да или нет» — тот же порядок слов, что в утверждении, только интонация и знак «;»: **Είσαι η Μαρία;** — «Ты Мария?»\nВопросительное слово — в начале: **Τι** είναι αυτό; **Πού** είναι ο Νίκος; **Πώς** είσαι?\nπού и πώς пишутся с ударением, хотя односложные: без ударения это другие слова (που «который», πως «что»).","ex":[{"ko":"Πού είναι η Άννα;","ru":"Где Анна?"},{"ko":"Τι είναι αυτό;","ru":"Что это?"},{"ko":"Πώς είσαι;","ru":"Как ты?"}]},{"id":"s7","title":"7. και, αλλά, ή","body":"**και** — «и», а также «а» при сопоставлении: Είμαι ο Νίκος και αυτός είναι ο Γιάννης. Перед гласной в речи — **κι**: κι εγώ.\n**αλλά** — «но»: Δεν είμαι η Ελένη, αλλά είμαι φίλη.\n**ή** — «или», с ударением: Αγόρι ή κορίτσι; (η без ударения — артикль).","ex":[{"ko":"Είναι άντρας ή γυναίκα;","ru":"Это мужчина или женщина?"}]}],"usage":[{"id":"u1","sit":"Представиться","phrase":"Είμαι η Μαρία.","note":"είμαι + артикль + имя; местоимение не нужно.","ex":[]},{"id":"u2","sit":"Представить другого","phrase":"Αυτός είναι ο Νίκος.","note":"αυτός / αυτή / αυτό — «это» по роду.","ex":[]},{"id":"u3","sit":"Кто ты / кто вы","phrase":"Είσαι ο Νίκος; Είστε η κυρία Ελένη;","note":"είσαι — на «ты», είστε — на «вы».","ex":[]},{"id":"u4","sit":"Сказать «не»","phrase":"Δεν είμαι η Μαρία.","note":"δεν перед глаголом.","ex":[]},{"id":"u5","sit":"Ответить «нет»","phrase":"Όχι, δεν είμαι η Ελένη.","note":"όχι — отдельное слово-ответ.","ex":[]},{"id":"u6","sit":"Спросить: что? где? как?","phrase":"Τι είναι αυτό; Πού είναι ο Νίκος; Πώς είσαι;","note":"вопросительное слово в начале.","ex":[]},{"id":"u7","sit":"и, но, или","phrase":"Αγόρι ή κορίτσι;","note":"και, αλλά, ή.","ex":[]}],"rel":[],"new":[],"parts":[{"id":"q1","title":"είμαι и местоимения","intro":"είμαι, είσαι, είναι, είμαστε, είστε, είναι. Местоимение обычно опускается. С именем — артикль; «кто такой» (друг, ребёнок) — без артикля.","schema":[0,1],"sections":["s1","s2","s3","s4"],"usage":["u1","u2","u3"],"ex":[[{"ru":"Я — Мария (Μαρία).","ko":"(Εγώ) είμαι η Μαρία.","alt":[],"u":"u1","traps":[{"a":"(Εγώ) είμαι Μαρία","why":"С именем нужен артикль: ο Νίκος, η Μαρία."}]},{"ru":"Ты — Никос (Νίκος)?","ko":"(Εσύ) είσαι ο Νίκος;","alt":[],"u":"u3","traps":[{"a":"(Εσύ) είσαι Νίκος","why":"С именем нужен артикль: ο Νίκος, η Μαρία."},{"a":"(Εσύ) είναι ο Νίκος","why":"«Ты» — είσαι."}]},{"ru":"Он — Янис (Γιάννης).","ko":"(Αυτός) είναι ο Γιάννης.","alt":[],"u":"u2","traps":[{"a":"(Αυτός) είναι Γιάννης","why":"С именем нужен артикль: ο Νίκος, η Μαρία."}]},{"ru":"Она — Елена (Ελένη).","ko":"(Αυτή) είναι η Ελένη.","alt":[],"u":"u2","traps":[{"a":"(Αυτή) είναι Ελένη","why":"С именем нужен артикль: ο Νίκος, η Μαρία."},{"a":"Αυτός είναι η Ελένη","why":"«Она» — αυτή."}]},{"ru":"Мы — Анна (Άννα) и Мария (Μαρία).","ko":"(Εμείς) είμαστε η Άννα και η Μαρία.","alt":[],"u":"u1","traps":[{"a":"(Εμείς) είμαι η Άννα και η Μαρία","why":"«Мы» — είμαστε."},{"a":"(Εμείς) είναι η Άννα και η Μαρία","why":"«Мы» — είμαστε."}]}],[{"ru":"Вы — госпожа Елена (Ελένη)?","ko":"(Εσείς) [είστε|είσαστε] η κυρία Ελένη;","alt":[],"u":"u3","traps":[{"a":"(Εσύ) είσαι η κυρία Ελένη","why":"Вежливое «Вы» — εσείς είστε."}]},{"ru":"Они — Никос (Νίκος) и Янис (Γιάννης).","ko":"(Αυτοί) είναι ο Νίκος και ο Γιάννης.","alt":[],"u":"u2","traps":[{"a":"(Αυτοί) είμαστε ο Νίκος και ο Γιάννης","why":"«Они» — είναι."}]},{"ru":"Это ребёнок.","ko":"[Αυτό είναι|Είναι] παιδί.","alt":[],"u":"u2","traps":[{"a":"Αυτός είναι παιδί","why":"παιδί — ср. р., поэтому αυτό."},{"a":"[Αυτό είναι|Είναι] το παιδί.","why":"«Кто такой» после είμαι — без артикля: παιδί. С артиклем — «тот самый, уже известный» (см. теорию, раздел 3)."}]},{"ru":"Я — друг.","ko":"(Εγώ) είμαι φίλος.","alt":[],"u":"u1","traps":[{"a":"(Εγώ) είμαι ο φίλος.","why":"«Кто такой» после είμαι — без артикля: φίλος. С артиклем — «тот самый, уже известный» (см. теорию, раздел 3)."}]},{"ru":"Ты — подруга.","ko":"(Εσύ) είσαι φίλη.","alt":[],"u":"u3","traps":[{"a":"(Εσύ) είσαι φίλος","why":"Подруга — φίλη."},{"a":"(Εσύ) είσαι η φίλη.","why":"«Кто такой» после είμαι — без артикля: φίλη. С артиклем — «тот самый, уже известный» (см. теорию, раздел 3)."}]}],[{"ru":"Он — мужчина, а она — женщина.","ko":"(Αυτός) είναι [άντρας|άνδρας] και (αυτή) είναι γυναίκα.","alt":[],"u":"u2","traps":[{"a":"(Αυτός) είναι [ο άντρας|ο άνδρας] και (αυτή) είναι γυναίκα.","why":"«Кто такой» после είμαι — без артикля: άντρας. С артиклем — «тот самый, уже известный» (см. теорию, раздел 3)."},{"a":"(Αυτός) είναι [άντρας|άνδρας] και (αυτή) είναι η γυναίκα.","why":"«Кто такой» после είμαι — без артикля: γυναίκα. С артиклем — «тот самый, уже известный» (см. теорию, раздел 3)."},{"a":"(Αυτός) είναι [ο άντρας|ο άνδρας] και (αυτή) είναι η γυναίκα.","why":"«Кто такой» после είμαι — без артикля: άντρας, γυναίκα. С артиклем — «тот самый, уже известный» (см. теорию, раздел 3)."}]},{"ru":"Это мальчик.","ko":"[Αυτό είναι|Είναι] αγόρι.","alt":[],"u":"u2","traps":[{"a":"Αυτός είναι αγόρι","why":"αγόρι — ср. р., поэтому αυτό."},{"a":"[Αυτό είναι|Είναι] το αγόρι.","why":"«Кто такой» после είμαι — без артикля: αγόρι. С артиклем — «тот самый, уже известный» (см. теорию, раздел 3)."}]},{"ru":"Это девочка.","ko":"[Αυτό είναι|Είναι] κορίτσι.","alt":[],"u":"u2","traps":[{"a":"Αυτή είναι κορίτσι","why":"κορίτσι — ср. р., поэтому αυτό."},{"a":"[Αυτό είναι|Είναι] το κορίτσι.","why":"«Кто такой» после είμαι — без артикля: κορίτσι. С артиклем — «тот самый, уже известный» (см. теорию, раздел 3)."}]},{"ru":"Вы — господин Никос (Νίκος)?","ko":"(Εσείς) [είστε|είσαστε] ο κύριος Νίκος;","alt":[],"u":"u3","traps":[{"a":"(Εσείς) είστε κύριος Νίκος","why":"С именем нужен артикль: ο Νίκος, η Μαρία."}]},{"ru":"Привет, я Анна (Άννα)!","ko":"Γεια σου, (εγώ) είμαι η Άννα!","alt":[],"u":"u1","traps":[{"a":"Γεια σου, (εγώ) είμαι Άννα","why":"С именем нужен артикль: ο Νίκος, η Μαρία."}]}]]},{"id":"q2","title":"Отрицание: δεν и όχι","intro":"δεν — «не» перед глаголом; όχι — «нет» отдельным словом.","schema":[2],"sections":["s5"],"usage":["u4","u5"],"ex":[[{"ru":"Я не Мария (Μαρία).","ko":"(Εγώ) δεν είμαι η Μαρία.","alt":[],"u":"u4","traps":[{"a":"(Εγώ) όχι είμαι η Μαρία","why":"«Не» перед глаголом — δεν. Όχι — отдельное «нет»."},{"a":"(Εγώ) δε είμαι η Μαρία","why":"Перед гласной — δεν."}]},{"ru":"Ты не Никос (Νίκος).","ko":"(Εσύ) δεν είσαι ο Νίκος.","alt":[],"u":"u4","traps":[{"a":"(Εσύ) όχι είσαι ο Νίκος","why":"«Не» перед глаголом — δεν. Όχι — отдельное «нет»."}]},{"ru":"Он не друг.","ko":"(Αυτός) δεν είναι φίλος.","alt":[],"u":"u4","traps":[{"a":"(Αυτός) όχι είναι φίλος","why":"«Не» перед глаголом — δεν. Όχι — отдельное «нет»."},{"a":"(Αυτός) δεν είναι ο φίλος.","why":"«Кто такой» после είμαι — без артикля: φίλος. С артиклем — «тот самый, уже известный» (см. теорию, раздел 3)."}]},{"ru":"Нет, я не Елена (Ελένη).","ko":"Όχι, (εγώ) δεν είμαι η Ελένη.","alt":[],"u":"u5","traps":[{"a":"Δεν, (εγώ) δεν είμαι η Ελένη","why":"«Нет» в ответе — όχι."}]},{"ru":"Это не мальчик, это девочка.","ko":"[Αυτό δεν είναι|Δεν είναι] αγόρι, [αυτό είναι|είναι] κορίτσι.","alt":[],"u":"u4","traps":[{"a":"[Αυτό δεν είναι|Δεν είναι] το αγόρι, [αυτό είναι|είναι] κορίτσι.","why":"«Кто такой» после είμαι — без артикля: αγόρι. С артиклем — «тот самый, уже известный» (см. теорию, раздел 3)."},{"a":"[Αυτό δεν είναι|Δεν είναι] αγόρι, [αυτό είναι|είναι] το κορίτσι.","why":"«Кто такой» после είμαι — без артикля: κορίτσι. С артиклем — «тот самый, уже известный» (см. теорию, раздел 3)."},{"a":"[Αυτό δεν είναι|Δεν είναι] το αγόρι, [αυτό είναι|είναι] το κορίτσι.","why":"«Кто такой» после είμαι — без артикля: αγόρι, κορίτσι. С артиклем — «тот самый, уже известный» (см. теорию, раздел 3)."}]}],[{"ru":"Мы не Анна (Άννα) и Мария (Μαρία).","ko":"(Εμείς) δεν είμαστε η Άννα και η Μαρία.","alt":[],"u":"u4","traps":[]},{"ru":"Вы не господин Никос (Νίκος)?","ko":"(Εσείς) δεν [είστε|είσαστε] ο κύριος Νίκος;","alt":[],"u":"u4","traps":[]},{"ru":"Она не женщина, она девочка.","ko":"(Αυτή) δεν είναι γυναίκα, (αυτή) είναι κορίτσι.","alt":[],"u":"u4","traps":[{"a":"(Αυτή) δεν είναι η γυναίκα, (αυτή) είναι κορίτσι.","why":"«Кто такой» после είμαι — без артикля: γυναίκα. С артиклем — «тот самый, уже известный» (см. теорию, раздел 3)."},{"a":"(Αυτή) δεν είναι γυναίκα, (αυτή) είναι το κορίτσι.","why":"«Кто такой» после είμαι — без артикля: κορίτσι. С артиклем — «тот самый, уже известный» (см. теорию, раздел 3)."},{"a":"(Αυτή) δεν είναι η γυναίκα, (αυτή) είναι το κορίτσι.","why":"«Кто такой» после είμαι — без артикля: γυναίκα, κορίτσι. С артиклем — «тот самый, уже известный» (см. теорию, раздел 3)."}]},{"ru":"Нет, спасибо.","ko":"Όχι, ευχαριστώ.","alt":[],"u":"u5","traps":[{"a":"Δεν, ευχαριστώ","why":"«Нет» в ответе — όχι."}]},{"ru":"Нет, он не Янис (Γιάννης).","ko":"Όχι, (αυτός) δεν είναι ο Γιάννης.","alt":[],"u":"u5","traps":[]}],[{"ru":"Я не ребёнок!","ko":"(Εγώ) δεν είμαι παιδί!","alt":[],"u":"u4","traps":[{"a":"(Εγώ) όχι είμαι παιδί","why":"«Не» перед глаголом — δεν. Όχι — отдельное «нет»."},{"a":"(Εγώ) δεν είμαι το παιδί!","why":"«Кто такой» после είμαι — без артикля: παιδί. С артиклем — «тот самый, уже известный» (см. теорию, раздел 3)."}]},{"ru":"Они не Никос (Νίκος) и Янис (Γιάννης).","ko":"(Αυτοί) δεν είναι ο Νίκος και ο Γιάννης.","alt":[],"u":"u4","traps":[]},{"ru":"Ты не подруга.","ko":"(Εσύ) δεν είσαι φίλη.","alt":[],"u":"u4","traps":[{"a":"(Εσύ) δεν είσαι η φίλη.","why":"«Кто такой» после είμαι — без артикля: φίλη. С артиклем — «тот самый, уже известный» (см. теорию, раздел 3)."}]},{"ru":"Это не Никос (Νίκος), это Янис (Γιάννης).","ko":"[Αυτός δεν είναι|Δεν είναι] ο Νίκος, [αυτός είναι|είναι] ο Γιάννης.","alt":[],"u":"u4","traps":[]},{"ru":"Да, я Анна (Άννα).","ko":"Ναι, (εγώ) είμαι η Άννα.","alt":[],"u":"u5","traps":[]}]]},{"id":"q3","title":"Вопрос; και, αλλά, ή","intro":"Вопрос — интонацией и «;»; τι, πού, πώς — в начале. И, но, или.","schema":[2],"sections":["s6","s7"],"usage":["u6","u7"],"ex":[[{"ru":"Ты — Мария (Μαρία)?","ko":"(Εσύ) είσαι η Μαρία;","alt":[],"u":"u3","traps":[]},{"ru":"Где Никос (Νίκος)?","ko":"Πού είναι ο Νίκος;","alt":[],"u":"u6","traps":[{"a":"Που είναι ο Νίκος","why":"«Где» — πού с ударением; που — «который»."}]},{"ru":"Как ты?","ko":"Πώς είσαι;","alt":[],"u":"u6","traps":[{"a":"Πως είσαι","why":"«Как» — πώς с ударением; πως — «что» (союз)."}]},{"ru":"Что это?","ko":"[Τι είναι αυτό|Αυτό τι είναι|Τι είναι];","alt":[],"u":"u6","traps":[]},{"ru":"Мальчик или девочка?","ko":"(Είναι) αγόρι ή κορίτσι;","alt":[],"u":"u7","traps":[{"a":"(Είναι) αγόρι η κορίτσι","why":"«Или» — ή с ударением; η — артикль."},{"a":"(Είναι) το αγόρι ή κορίτσι;","why":"«Кто такой» после είμαι — без артикля: αγόρι. С артиклем — «тот самый, уже известный» (см. теорию, раздел 3)."},{"a":"(Είναι) αγόρι ή το κορίτσι;","why":"«Кто такой» после είμαι — без артикля: κορίτσι. С артиклем — «тот самый, уже известный» (см. теорию, раздел 3)."},{"a":"(Είναι) το αγόρι ή το κορίτσι;","why":"«Кто такой» после είμαι — без артикля: αγόρι, κορίτσι. С артиклем — «тот самый, уже известный» (см. теорию, раздел 3)."}]}],[{"ru":"Это Анна (Άννα) или Мария (Μαρία)?","ko":"[Αυτή είναι|Είναι] η Άννα ή η Μαρία;","alt":[],"u":"u7","traps":[{"a":"[Αυτή είναι|Είναι] η Άννα η η Μαρία","why":"«Или» — ή с ударением."}]},{"ru":"Я — Никос (Νίκος), а это Янис (Γιάννης).","ko":"(Εγώ) είμαι ο Νίκος και [αυτός είναι|είναι] ο Γιάννης.","alt":[],"u":"u7","traps":[]},{"ru":"Я не Елена (Ελένη), но я подруга.","ko":"(Εγώ) δεν είμαι η Ελένη, αλλά (εγώ) είμαι φίλη.","alt":[],"u":"u7","traps":[{"a":"(Εγώ) δεν είμαι η Ελένη, αλλά (εγώ) είμαι η φίλη.","why":"«Кто такой» после είμαι — без артикля: φίλη. С артиклем — «тот самый, уже известный» (см. теорию, раздел 3)."}]},{"ru":"Где ты?","ko":"Πού είσαι;","alt":[],"u":"u6","traps":[{"a":"Που είσαι","why":"«Где» — πού с ударением."}]},{"ru":"Как вы? (вежливо)","ko":"Πώς [είστε|είσαστε];","alt":[],"u":"u6","traps":[{"a":"Πώς είσαι","why":"Вежливо — είστε."}]}],[{"ru":"Как тебя зовут?","ko":"Πώς σε λένε;","alt":[],"u":"u6","traps":[]},{"ru":"Откуда ты?","ko":"Από πού είσαι;","alt":[],"u":"u6","traps":[]},{"ru":"Где Анна (Άννα) и Мария (Μαρία)?","ko":"Πού είναι η Άννα και η Μαρία;","alt":[],"u":"u6","traps":[]},{"ru":"Это мужчина или женщина?","ko":"Είναι [άντρας|άνδρας] ή γυναίκα;","alt":[],"u":"u7","traps":[{"a":"Είναι [ο άντρας|ο άνδρας] ή γυναίκα;","why":"«Кто такой» после είμαι — без артикля: άντρας. С артиклем — «тот самый, уже известный» (см. теорию, раздел 3)."},{"a":"Είναι [άντρας|άνδρας] ή η γυναίκα;","why":"«Кто такой» после είμαι — без артикля: γυναίκα. С артиклем — «тот самый, уже известный» (см. теорию, раздел 3)."},{"a":"Είναι [ο άντρας|ο άνδρας] ή η γυναίκα;","why":"«Кто такой» после είμαι — без артикля: άντρας, γυναίκα. С артиклем — «тот самый, уже известный» (см. теорию, раздел 3)."}]},{"ru":"Ты Янис (Γιάννης)? — Нет, я Никос (Νίκος).","ko":"(Εσύ) είσαι ο Γιάννης; — Όχι, (εγώ) είμαι ο Νίκος.","alt":[],"u":"u5","traps":[]}]]}]},{"id":"g7","n":7,"title":"Род и артикль ο/η/το","meaning":"У каждого существительного свой род: мужской (**ο**), женский (**η**) или средний (**το**). Род часто не совпадает с русским: η θάλασσα — «море», το κορίτσι — «девочка». Чаще всего род виден по окончанию; исключения запоминаются со словом — поэтому слова учим всегда с артиклем.\nУпотребление: страна, город, остров — **с артиклем** (η Ελλάδα, η Αθήνα); национальность после είμαι — **без** (Είμαι Ρωσίδα); язык после ξέρω, καταλαβαίνω — **без** (Ξέρω ελληνικά).\nУпражнения: часть 1 — допиши артикль к слову; части 2–3 — перевод фраз.","task_rk":"переведи на греческий","schema":[{"title":"Артикль: именительный падеж, ед. ч.","cols":["Род","Артикль","Пример"],"rows":[["мужской","ο","ο φίλος · ο Έλληνας · ο τουρίστας"],["женский","η","η χώρα · η πόλη · η Ελλάδα"],["средний","το","το νησί · το παιδί · το όνομα"]],"note":"Мн. ч. (οι, τα) — тема 17. Перед гласной артикль не меняется: ο άντρας, η Αθήνα, το όνομα."},{"title":"Род по окончанию","cols":["Окончание","Род","Примеры"],"rows":[["-ος · -ης · -ας","м. (ο)","ο φίλος · ο Γιάννης · ο Έλληνας"],["-α · -η","ж. (η)","η χώρα · η Ρωσία · η πόλη"],["-ο · -ι · -μα","ср. (το)","το τηλέφωνο · το νησί · το όνομα"]],"note":"Исключения запоминаются со словом: η Κύπρος (на -ος, но ж. р.). Пары по полу: ο Έλληνας — η Ελληνίδα, ο Ρώσος — η Ρωσίδα, ο φίλος — η φίλη."},{"title":"Артикль: нужен или нет","cols":["Случай","Как"],"rows":[["страна, город, остров","с артиклем · η Ελλάδα είναι χώρα · Πού είναι η Αθήνα;"],["национальность, «кто такой»","без · Είμαι Ρωσίδα · Ο Νίκος είναι Έλληνας"],["язык после ξέρω, καταλαβαίνω","без · Ξέρω ελληνικά · Δεν καταλαβαίνω αγγλικά"]]}],"sections":[{"id":"s1","title":"1. Три рода: ο, η, το","body":"Каждое существительное — мужского, женского или среднего рода; род показывает артикль: **ο** φίλος, **η** χώρα, **το** νησί.\nРод не связан с русским: **η** θάλασσα — «море» (ж. р.), **το** κορίτσι — «девочка» (ср. р.), **το** παιδί — «ребёнок» (ср. р.). Поэтому существительное учим и пишем сразу с артиклем — так в словаре и в проверке.","ex":[{"ko":"η θάλασσα","ru":"море"},{"ko":"το κορίτσι","ru":"девочка"}]},{"id":"s2","title":"2. Род по окончанию","body":"**м. р.** — на -ος, -ης, -ας: ο φίλος, ο Γιάννης, ο τουρίστας.\n**ж. р.** — на -α, -η: η χώρα, η Ρωσία, η πόλη, η διεύθυνση.\n**ср. р.** — на -ο, -ι, -μα: το τηλέφωνο, το νησί, το όνομα.\nИсключения бывают — чаще всего женские слова на -ος: **η Κύπρος**. Их помнишь по артиклю в словаре.\nМужчина и женщина часто — пара с разными окончаниями: ο Έλληνας — η Ελληνίδα, ο Ρώσος — η Ρωσίδα.","ex":[{"ko":"ο τουρίστας","ru":"турист"},{"ko":"η Κύπρος","ru":"Кипр"},{"ko":"το όνομα","ru":"имя"}]},{"id":"s3","title":"3. Страны, города, острова — с артиклем","body":"В русском «Греция — страна», в греческом — **Η Ελλάδα** είναι χώρα. Названия стран, городов и островов идут с артиклем, как имена людей (тема 5).\nБольшинство из них — женского рода: η Ελλάδα, η Ρωσία, η Αγγλία, η Αθήνα, η Κύπρος, η Κρήτη.\nАртикль остаётся и в вопросе: Πού είναι **η** Αθήνα;","ex":[{"ko":"Η Ελλάδα είναι χώρα.","ru":"Греция — страна."},{"ko":"Η Κύπρος είναι νησί.","ru":"Кипр — остров."}]},{"id":"s4","title":"4. Национальность — без артикля","body":"Как «кто такой» в теме 5: после είμαι национальность, профессия, «турист», «иностранец» — **без артикля**: Είμαι **Ρωσίδα**, Ο Νίκος είναι **Έλληνας**, Είμαι **τουρίστας**.\nНациональность пишется **с заглавной** буквы: Έλληνας, Ρωσίδα. Слово ξένος «иностранный» — прилагательное, его женская форма — ξένη: Είμαι ξένη.\nТак же «Греция — страна»: χώρα без артикля, а Ελλάδα — с ним.","ex":[{"ko":"Είμαι Ρωσίδα.","ru":"Я русская."},{"ko":"Ο Γιάννης είναι τουρίστας.","ru":"Янис — турист."}]},{"id":"s5","title":"5. Языки — без артикля после ξέρω, καταλαβαίνω","body":"Название языка — ελληνικά, ρωσικά, αγγλικά (со строчной). После «знаю, понимаю, говорю» — **без артикля**: Ξέρω **ελληνικά**, Δεν καταλαβαίνω **αγγλικά**.\nЕсли язык — подлежащее, о котором говорят, артикль появляется: **Τα ελληνικά** είναι ωραία — «Греческий красивый» (позже, тема 31).\nξέρω и καταλαβαίνω пока только в форме «я»; все формы — тема 11. «Немного» — λίγο: Ξέρω λίγο ελληνικά.","ex":[{"ko":"Ξέρω λίγο ελληνικά.","ru":"Я немного знаю греческий."},{"ko":"Δεν καταλαβαίνω.","ru":"Я не понимаю."}]}],"usage":[{"id":"u1","sit":"Слово с артиклем","phrase":"η θάλασσα · το νησί · ο τουρίστας","note":"род — по окончанию или по словарю.","ex":[]},{"id":"u2","sit":"Страна, город, остров","phrase":"Η Ελλάδα είναι χώρα.","note":"с артиклем.","ex":[]},{"id":"u3","sit":"Национальность, «кто такой»","phrase":"Είμαι Ρωσίδα.","note":"без артикля, с заглавной.","ex":[]},{"id":"u4","sit":"Какой язык знаю","phrase":"Ξέρω λίγο ελληνικά.","note":"язык после ξέρω — без артикля.","ex":[]}],"rel":[],"new":[],"parts":[{"id":"q1","title":"Род и артикль по окончанию","intro":"ο — м. р. (-ος, -ης, -ας), η — ж. р. (-α, -η), το — ср. р. (-ο, -ι, -μα). Исключения — по словарю.","schema":[0,1],"sections":["s1","s2"],"usage":["u1"],"ex":[[{"ru":"Артикль: __ θάλασσα (море)","ko":"η θάλασσα","alt":[],"u":"u1","traps":[{"a":"ο θάλασσα","why":"-α — обычно ж. р.: η θάλασσα."},{"a":"το θάλασσα","why":"-α — обычно ж. р.: η θάλασσα."},{"a":"θάλασσα","why":"Существительное — с артиклем: η θάλασσα."}]},{"ru":"Артикль: __ χώρα (страна)","ko":"η χώρα","alt":[],"u":"u1","traps":[{"a":"ο χώρα","why":"-α — обычно ж. р.: η χώρα."},{"a":"το χώρα","why":"-α — обычно ж. р.: η χώρα."},{"a":"χώρα","why":"Существитель ебёнок."}],"after":"g5"},{"title":"Страна, город, остров — с артиклем · тема 7","body":"Η **Ελλάδα** είναι χώρα, Πού είναι **η** Αθήνα; Почти все — женского рода, даже на -ος: η Κύπρος.","ex":[{"ko":"Η Κύπρος είναι νησί.","ru":"Кипр — остров."}],"after":"g7"},{"title":"Национальность — без артикля · тема 7","body":"Как «кто такой»: Είμαι **Ρωσίδα**, Ο Νίκος είναι **Έλληνας**. Пишется с заглавной.","ex":[{"ko":"Είμαι Ρώσος.","ru":"Я русский."}],"after":"g7"},{"title":"Язык после ξέρω, καταλαβαίνω — без артикля · тема 7","body":"Ξέρω **ελληνικά**, Δεν καταλαβαίνω **αγγλικά**. Язык-подлежащее — с артиклем: **Τα** ελληνικά είναι ωραία.","ex":[{"ko":"Ξέρω λίγο ελληνικά.","ru":"Я немного знаю греческий."}],"after":"g7"}]}],"dlg":[]}</script>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.45 -apple-system,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}

.wrap{max-width:560px;margin:0 auto}
input[type=search]{width:100%;font:inherit;font-size:17px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);outline:none}
input[type=search]:focus{border-color:var(--acc)}
.bar{display:flex;gap:6px;margin-top:7px;align-items:center;flex-wrap:wrap}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:2px;flex:1;min-width:0}

.seg button.on{background:var(--accbg);color:var(--acc);font-weight:600}
.chip{border:1px solid var(--line);background:var(--card);color:var(--mut);font:inherit;font-size:15px;padding:6px 10px;border-radius:9px;white-space:nowrap}
.chip.on{background:var(--accbg);color:var(--acc);border-color:transparent;font-weight:600}
.chip:disabled{opacity:.35}
.jump{display:flex;gap:6px;overflow-x:auto;margin-top:7px;padding-bottom:2px;scrollbar-width:none}.jump::-webkit-scrollbar{display:none}.jump .chip{flex:none}
.wkb{flex:none;padding:6px 11px}
.cnt{font-size:14px;color:var(--mut);margin-left:auto}
main{padding:0 12px 24px}
h2{font-size:15px;font-weight:600;color:var(--mut);margin:20px 0 4px;scroll-margin-top:calc(var(--hh,180px) + 6px);display:flex;gap:8px;align-items:baseline}
h2 .cur{color:var(--acc);font-weight:600}
h3{font-size:14px;font-weight:500;color:var(--mut);margin:12px 0 2px}
.row{display:flex;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:has(+h2),.row:last-child{border-bottom:2px solid var(--acc)} .txt{flex:1;min-width:0}
.ko{font-size:22px;font-weight:500}

<script>
/* ===== Язык приложения (lang/el) ===== */
const LANG=(()=>{
 // латинские буквы-двойники → греческие (только в строке, где уже есть греческие буквы)
 const LAT={a:'α',b:'β',e:'ε',h:'η',i:'ι',k:'κ',m:'μ',n:'ν',o:'ο',p:'ρ',t:'τ',x:'χ',y:'υ',z:'ζ',u:'υ',v:'ν'};
 const isG=s=>/[\u0370-\u03ff\u1f00-\u1fff]/.test(s);
 // сравнение: ударение строго; регистр не важен; ς = σ; латиница-двойники → греческие
 function fold(s){s=String(s||'').normalize('NFC').toLowerCase();
  if(isG(s))s=s.replace(/[a-z]/g,c=>LAT[c]||c);
  return s.replace(/ς/g,'σ').replace(/\u037e/g,';').replace(/\u0387/g,'·');}
 // для показа: конечная σ → ς
 const pretty=s=>String(s).replace(/σ(?![α-ωάέήίόύώϊϋΐΰ])/g,'ς');
 const bare=s=>String(s).normalize('NFD').replace(/\u0301/g,'').normalize('NFC');
 // звуковой скелет: буквы, которые звучат одинаково
 const snd=s=>bare(s).replace(/ει|οι|υι|η|υ/g,'ι').replace(/ω/g,'ο').replace(/αι/g,'ε');
 const W0=s=>String(s||'').normalize('NFC').replace(/[.,!?;:·'’"«»()\-–—\u037e]/g,' ').split(/\s+/).filter(Boolean);
 const words=s=>W0(fold(s));
 // слоги: безударные ι/υ/ει/οι перед гласной слога не образуют (γεια, μια, ποιος)
 const syl=w=>(bare(w).replace(/(ει|οι|ι|υ)(?=[αεοω]|ου)/g,'').match(/ου|αι|ει|οι|υι|αυ|ευ|[αεηιουωϊϋ]/g)||[]).length;
 const PAIR={'πού':'πού — «где», που — «который, что»','πώς':'πώς — «как», πως — «что» (союз)','ή':'ή — «или», η — артикль'};
 const accN=w=>(w.normalize('NFD').match(/\u0301/g)||[]).length;
 // пояснение к неверному ответу: ударение или «звучит так же, пишется иначе»
 const ARTS=new Set(['ο','η','το','οι','τα']);
 function wnote(v,ref){const A=words(v),B=words(ref),B0=W0(ref);if(!A.length)return '';
  // артикль у существительного
  if(B.length===A.length+1&&ARTS.has(B[0])&&A.join(' ')===B.slice(1).join(' '))return 'Существительное учим с артиклем: '+B0.join(' ')+'.';
  if(A.length===B.length&&A.length>1&&ARTS.has(A[0])&&ARTS.has(B[0])&&A[0]!==B[0]&&A.slice(1).join(' ')===B.slice(1).join(' '))return 'Неверный артикль: '+B0.join(' ')+'.';
  if(A.length!==B.length)return '';
  const acc=[],spl=[];
  for(let i=0;i<A.length;i++){const a=A[i],b0=B[i],b=B0.length===B.length?B0[i]:pretty(b0);if(a===b0)continue;
   if(bare(a)===bare(b0)){const pr=PAIR[a]||PAIR[b];
    if(pr)acc.push('разные слова: '+pr);
    else if(!accN(a)&&accN(b))acc.push('нет ударения в слове '+b);
    else if(accN(a)&&!accN(b)&&syl(b)<=1)acc.push('слово '+b+' односложное — пишется без ударения');
    else if(accN(a)&&!accN(b))acc.push('лишнее ударение: '+b);
    else acc.push('ударение не на том слоге: '+b);continue;}
   if(snd(a)===snd(b0)){spl.push(b);continue;}
   return '';}
  const o=[];if(acc.length){const t=acc.join('; ');o.push(t[0].toUpperCase()+t.slice(1)+'.');}

/* Чистка состояния (03.10): храним позицию, «плохо помню», «Спорные», счётчики и незаконченное.
   Уроки прошлых тем (lesArc) — только текущая позиция и повтор; в уроке — тексты завершённых блоков удаляются, остаются вердикты. */
function pruneST(){try{

 const S=Object.values((ST.les&&ST.les.by)||{});for(const L of Object.values(ST.lesArc||{}))S.push(...Object.values((L&&L.by)||{}));
 for(const s of S){if(!s||!s.bl||typeof s.bi!=='number')continue;
  for(const i of Object.keys(s.bl)){if(+i<s.bi&&s.res&&s.res[i]){const B=s.bl[i]||[],A=(s.ans&&s.ans[i])||[];delete s.bl[i];if(s.ans)delete s.ans[i];
   s.res[i]=s.res[i].map((r,k)=>{if(!r||typeof r!=='object')return r;const o={v:r.v,e:r.e||'',man:r.man||0};
    if(r.v==='bad'){const x=B[k]||r.x;if(x)o.x={t:x.t,u:x.u,ru:x.ru,ko:x.ko};o.a=String(A[k]!=null?A[k]:(r.a||'')).trim();if(r.fix)o.fix=r.fix;if(r.note)o.note=r.note;}return o;});}}}
 if(ST.lesArc&&!Object.keys(ST.lesArc).length)delete ST.lesArc;
}catch(e){}}

 if(!REF)TLOCAL=true;
 const best=[rem,loc].filter(Boolean).sort((a,b)=>(b.upd||0)-(a.upd||0))[0];
 if(best)ST=Object.assign({v:1,weak:{},stats:{},sess:null,last:[]},best);
 let fix=false;for(const x of [...Object.values(ST.rs||{}),ST.rsess,...Object.values((ST.sess&&ST.sess.by)||{})]){const c=x&&x.cur,it=x&&x.q&&x.q[x.pos];

 if(fix||(REF&&loc&&(!rem||(loc.upd||0)>(rem.upd||0))))saveST();
 if(OFF&&offPurge())saveST();
 try{if(COURSE.sync(ST)&&!SSX.getItem('courseRl')){SSX.setItem('courseRl','1');location.reload();return;}}catch(e){}
 TREADY=true;render();setTimeout(()=>{try{lesPump();}catch(e){}},500);}

function offPurge(){let n=0;const S=[...Object.values((ST.les&&ST.les.by)||{}),...Object.values(ST.grs||{})];
 for(const s of S){if(!s||!s.bl)continue;for(const i of Object.keys(s.bl)){const b=s.bl[i];if(!b||(s.res&&s.res[i]))continue;
  if(b.some(x=>x&&x.bid))continue;

  if(st)continue;delete s.bl[i];if(s.ans)delete s.ans[i];n++;}}

- "ok" — верно. Засчитывай любой грамматически правильный вариант, передающий смысл: другой порядок слов, синоним, 뭐 ↔ 무엇, 하고 ↔ 와/과, и полную учебную форму, и общепринятые разговорные упрощения (опущенные 저는/тема, выпадение 이/가 и 을/를, 어디 가요? без 에, ответ-обрывок без связки (число, существительное: 오 층, 커피), N(이)요 для обрывка (칠팔구공이요, 커피요), дефис в номере как 에). Упрощение, нормальное для живой речи, — НЕ ошибка и не повод для fix или note. Буквального совпадения с эталоном не требуй. Исключение: «мама/папа» — 엄마/아빠, «мать/отец» — 어머니/아버지; переводи строго по заданию, замена (어머니 на «мама» и наоборот) — ошибка, объясни разницу. Верный корейский за пределами пройденного (слово или форма, которых ученик ещё не учил, но употреблённые правильно и уместно: 호 для номера комнаты, 제 вместо 저의 и т.п.) — это \"ok\", а не ошибка; в tip можно отметить, что так тоже говорят. Эталон — не единственный правильный ответ. Не заменяй в fix допустимое на эталонное (은/는 ↔ 이/가, где уместны оба, порядок слов, синонимы). Пунктуация и пробелы — не ошибка. Текст в скобках в задании не переводится.

- "bad" — ошибка частицы (в т.ч. 에/에서 перед 도/만, 은/는 ↔ 이/가 там, где нужен контраст или новое), формы, времени, связки, 에 ↔ 에서, не то слово, не тот уровень вежливости, потерян смысл («а», «тоже», «только», «не могу»).`:`Оценки:
- "ok" — смысл передан верно в контексте диалога; порядок слов, синонимы, стиль русского перевода и опечатки в русском не важны. Имена в любой кириллической передаче — не ошибка.
- "typo" — не используется.
- "bad" — неверно понято слово, время, отрицание, «тоже/только/не могу», вопрос/утверждение, кто что делает.`}

 h+=`<p class="mut">Файл прогресса: слова «плохо помню», статистика, уроки, серии. Храни в iCloud / Drive / Telegram. Загрузка на другом устройстве переносит прогресс туда.${OFF?'':' Внутри Claude прогресс и так сохраняется в базе — выгрузка нужна как бэкап и для переноса в автономную версию.'}</p>`;
 h+=`<p>Владелец: <input type="text" id="pgown" value="${esc(owner())}" placeholder="имя" style="width:60%"></p>`;
 h+=`<div class="pb"><button data-p="exp" class="pri">Выгрузить</button><label style="display:inline-block"><input type="file" id="pgfile" accept=".json,application/json,text/plain" hidden><button data-p="impf" type="button">Загрузить файл</button></label><button data-p="impt">Вставить текстом</button></div>`;
 if(PGS.msg)h+=`<p>${PGS.msg}</p>`;
 if(PGS.txt==='exp')h+=`<p class="mut">Файл не отдаётся напрямую — скопируй текст ниже и сохрани в заметку или файл .json.</p><textarea id="pgta" rows="6" readonly>${esc(JSON.stringify(expData()))}</textarea><div class="pb"><button data-p="tcopy">Скопировать</button></div>`;
 if(PGS.txt==='imp')h+=`<p class="mut">Вставь текст выгрузки:</p><textarea id="pgin" rows="6"></textarea><div class="pb"><button data-p="tread" class="pri">Прочитать</button></div>`;
 if(PGS.imp){const d=PGS.imp,old=(d.upd||0)<(ST.upd||0),other=d.owner&&owner()&&d.owner!==owner();
  h+=`<div class="gi"><p>Файл: владелец <b>${esc(d.owner||'—')}</b>, выгружен ${dt(d.ts)}. «Плохо помню»: ${Object.values(d.st.weak||{}).filter(x=>x&&x.on).length}.</p>`+
   (old?`<p style="color:#b45309">Этот прогресс старше текущего на устройстве.</p>`:'')+(other?`<p style="color:#b45309">Файл другого владельца.</p>`:'')+
   `<p class="mut">Загрузка заменит ${OFFT?'тестовую копию':OFF?'прогресс на этом устройстве':'основной прогресс (и в базе Claude)'}.</p>
   <div class="pb"><button data-p="iok" class="${old||other?'warn':'pri'}">${old||other?'Всё равно загрузить':'Загрузить'}</button><button data-p="ino">Отмена</button></div></div>`;}
 if(window.APPV)h+=`<p class="mut" style="margin-top:28px">Версия приложения: ${esc(window.APPV)}</p>`;
 $('list').innerHTML=h+`</div>`;}
function pgRead(txt){try{const d=JSON.parse(txt);if(!d||d.app!==LANG.code+'-trainer'||!d.st||typeof d.st!=='object')throw 0;PGS.imp=d;PGS.msg='';PGS.txt='';}
 catch(e){PGS.imp=null;PGS.msg='Не удалось прочитать: это не файл прогресса.';}render();}
async function pgExport(){const d=expData(),js=JSON.stringify(d),name='greek_progress_'+new Date().toISOString().slice(0,10)+'.json';
 const done=()=>{try{LSX.setItem(expKey(),String(Date.now()));}catch(e){}PGS.msg='Выгружено.';render();};
 try{const f=new File([js],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return done();}}catch(e){if(e&&e.name==='AbortError'){PGS.msg='Отменено.';return render();}}
 if(HASC){PGS.txt='exp';try{LSX.setItem(expKey(),String(Date.now()));}catch(e){}return render();}
 try{const u=URL.createObjectURL(new Blob([js],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);done();}
 catch(e){PGS.txt='exp';render();}}
$('list').addEventListener('click',e=>{const b=e.target.closest('#pg [data-p]');if(!b)return;const a=b.dataset.p;
 if(a==='ctg'){PGS[b.dataset.v]=!PGS[b.dataset.v];return render();}
 if(a==='cview'||a==='cset'||a==='cdone')return courseClick(a,b.dataset.id);
 if(a!=='dclr'&&a!=='treset')PGS.ask='';
 if(a==='treset'){if(PGS.ask!=='treset'){PGS.ask='treset';render();setTimeout(()=>{if(PGS.ask==='treset'){PGS.ask='';render();}},4000);return;}PGS.ask='';delete ST.les;delete ST.grs;saveST();PGS.msg='Урок и повторение начаты заново.';return render();}
 if(a==='weak'){S.weak=true;return setApp('dict');}
 if(a==='dcopy'){const t=(ST.disp||[]).map(x=>[x.t,x.u,x.bid,x.ru,x.ko,x.a,x.v].join(' | ')).join('\n');
  const txt='СПОРНЫЕ ОТВЕТЫ (тема | модель | id | задание | эталон | ответ | решение)\n'+t;
  try{navigator.clipboard.writeText(txt).then(()=>{b.textContent='Скопировано';},()=>{PGS.txt='';PGS.msg='';const w=$('list');w.insertAdjacentHTML('beforeend',`<textarea rows="6" style="width:100%">${esc(txt)}</textarea>`);});}catch(x){}return;}
 if(a==='dclr'){if(PGS.ask!=='dclr'){PGS.ask='dclr';render();setTimeout(()=>{if(PGS.ask==='dclr'){PGS.ask='';render();}},4000);return;}PGS.ask='';ST.disp=[];saveST();return render();}
 if(a==='exp')return pgExport();
 if(a==='impf'){const f=$('pgfile');f.value='';return f.click();}
 if(a==='impt'){PGS.txt='imp';PGS.imp=null;return render();}
 if(a==='tread')return pgRead($('pgin').value);
 if(a==='tcopy'){const t=$('pgta');t.select();try{navigator.clipboard.writeText(t.value).then(()=>{b.textContent='Скопировано';},()=>{b.textContent='Выдели и скопируй вручную';});}catch(x){b.textContent='Выдели и скопируй вручную';}return;}
 if(a==='ino'){PGS.imp=null;return render();}
 if(a==='iok'){const d=PGS.imp;ST=Object.assign({v:1,weak:{},stats:{},sess:null,last:[]},d.st);saveST();PGS.imp=null;PGS.msg='Прогресс загружен ('+dt(d.ts)+').';offUI();try{if(COURSE.sync(ST)){location.reload();return;}}catch(e){}return render();}});
$('list').addEventListener('change',e=>{if(e.target.id==='pgfile'){const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>pgRead(String(r.result||''));r.readAsText(f);}
 if(e.target.id==='pgown'){try{LSX.setItem('owner',e.target.value.trim());}catch(x){}}});
function firstRun(){try{let t=+LSX.getItem('firstRun')||0;if(!t){t=Date.now();LSX.setItem('firstRun',String(t));}return t;}catch(e){return Date.now();}}
function offUI(){const le=lastExp(),rem=OFF&&!OFFT&&(le?daysAgo(le)>=7:daysAgo(firstRun())>=7);
 $('offbn').textContent=OFFT?'Автономный режим · тест (прогресс отдельно от основного)':'Автономный режим'+(rem?' · прогресс не выгружался '+(le?daysAgo(le)+' дн.':'ни разу')+' → Прогресс':'');
 $('offbn').hidden=!(OFFT||rem);$('offb').hidden=!HASC;$('offb').textContent='Автономный режим: '+(OFFT?'вкл':'выкл');$('offb').classList.remove('ask');}
offUI();let OFFASK=0;
$('offb').onclick=async e=>{e.stopPropagation();
 if(!OFFASK){OFFASK=1;$('offb').textContent=OFFT?'Выключить? Нажми ещё раз':'Включить тест? Нажми ещё раз';$('offb').classList.add('ask');
  setTimeout(()=>{if(OFFASK){OFFASK=0;offUI();}},4000);return;}
 OFFASK=0;$('mm').hidden=true;const on=!OFFT;
 try{saveST();await SAVEQ;}catch(x){}
 let seeded=false;
 try{const db=DBH||(DBH=await window.claude.use('db'));await db.doc('trainer/mode').set({off:on});
  if(on){const t=await db.doc('trainer/state_off').get();if(!t.exists){const snap=JSON.parse(JSON.stringify(ST));await db.doc('trainer/state_off').set(snap);seeded=true;}}}catch(x){}
 try{if(on){if(seeded||!LSX.getItem('trainer_off'))LSX.setItem('trainer_off',JSON.stringify(ST));LSX.setItem('offmode','1');}else LSX.removeItem('offmode');}catch(x){}
 OFFT=on;OFF=!HASC||on;LSK=OFFT?'trainer_off':'trainer';SMPP=null;REF=null;TREADY=false;TLOCAL=false;
 ST={v:1,weak:{},stats:{},sess:null,last:[]};offUI();initST();};
const HASD=!!(D.dlg&&D.dlg.length);{const b=$('mm').querySelector('[data-m="dlg"]');if(b&&!HASD)b.hidden=true;}
let A0='dict';try{A0=LSX.getItem('app')||'dict';}catch(e){}if(A0==='dlg'&&!HASD)A0='dict';
setApp(['gram','train','rev','dlg'].includes(A0)?A0:'dict');

</script>
<div id="updbar" hidden style="position:fixed;left:0;right:0;bottom:0;z-index:2147483000;background:#1f5f9e;color:#fff;font-size:18px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;justify-content:space-between;pointer-events:auto">
<span style="flex:1">Доступна новая версия</span><button id="updbtn" style="border:0;border-radius:10px;padding:10px 16px;font:inherit;font-size:18px;font-weight:600;background:#fff;color:#1f5f9e">Обновить</button><button id="updx" aria-label="Закрыть" style="border:0;background:none;color:#fff;font-size:26px;line-height:1;padding:4px 6px">×</button></div>
<script>
(function(){const bar=document.getElementById('updbar'),SW=navigator.serviceWorker;
 const hide=()=>{bar.hidden=true;bar.style.display='none';};const show=()=>{bar.hidden=false;bar.style.display='flex';};hide();
 // проверка версии на сервере (только при сети)
 const check=()=>{if(!navigator.onLine)return;fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{if(d&&d.v&&d.v!==window.APPV)show();}).catch(()=>{});};
 // надёжное обновление: сброс кэша приложения и загрузка свежей версии (прогресс не затрагивается)
 const go=async()=>{hide();try{const ks=await caches.keys();await Promise.all(ks.filter(k=>k.startsWith("el-")).map(k=>caches.delete(k)));}catch(e){}
  try{if(SW){const me=new URL('./',location.href).href,rs=await SW.getRegistrations();await Promise.all(rs.filter(r=>r.scope===me).map(r=>r.unregister()));}}catch(e){}
  location.replace(location.pathname+'?u='+Date.now());};
 document.getElementById('updbtn').addEventListener('click',go);
 document.getElementById('updx').addEventListener('click',hide);
 if(SW)SW.register('sw.js').then(reg=>{document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){reg.update().catch(()=>{});check();}});}).catch(()=>{});
 check();
 if(location.search.includes('u='))history.replaceState(null,'',location.pathname);})();
</script>
